<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TNAS Backup</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="hidden">
  <form id="loginForm" class="login-box">
    <div class="login-logo"><img src="favicon.svg" alt=""> <span id="loginHost">TNAS</span></div>
    <p class="muted">Backup-Ziel – Anmeldung mit dem TNAS-Benutzerkonto</p>
    <label>Benutzer<input id="loginUser" autocomplete="username" required></label>
    <label>Passwort<input id="loginPass" type="password" autocomplete="current-password" required></label>
    <label class="check"><input type="checkbox" id="loginRemember" checked> Auf diesem Gerät angemeldet bleiben</label>
    <div id="loginErr" class="err"></div>
    <button type="submit" class="primary">Anmelden</button>
  </form>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <button id="navToggle" class="icon-btn" aria-label="Menü">☰</button>
    <div class="brand"><img src="favicon.svg" alt=""> <span id="hostName">TNAS</span> <span class="tag">Backup</span></div>
    <div class="spacer"></div>
    <span id="whoami" class="muted"></span>
    <button id="logoutBtn" class="ghost">Abmelden</button>
  </header>
  <nav id="nav">
    <a href="#/dashboard" data-page="dashboard">📊 Übersicht</a>
    <div class="nav-group">Speicher</div>
    <a href="#/disks" data-page="disks">💽 Datenträger</a>
    <a href="#/files" data-page="files">🔎 Dateien</a>
    <a href="#/shares" data-page="shares">📁 Freigaben (SMB)</a>
    <a href="#/snapshots" data-page="snapshots">🕘 Backup-Versionen</a>
    <a href="#/cloud" data-page="cloud">☁️ Cloud-Backup</a>
    <div class="nav-group">Zugriff</div>
    <a href="#/users" data-page="users">👤 Benutzer</a>
    <div class="nav-group">System</div>
    <a href="#/services" data-page="services">⚙️ Dienste</a>
    <a href="#/logs" data-page="logs">📜 Protokolle</a>
    <a href="#/power" data-page="power">⏻ Energie</a>
    <div class="nav-foot muted" id="navFoot"></div>
  </nav>
  <main id="main"></main>
</div>

<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
